name = "fairfix"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# --- KV namespaces ---
# Waitlist emails are stored here.
# Create the namespace once via the Cloudflare dashboard, then paste the id below.
#
# [[kv_namespaces]]
# binding = "WAITLIST"
# id = "<your-kv-namespace-id>"

# --- Environment variables ---
# Prefer setting these in the Cloudflare Pages dashboard.
# Anything committed here is public — do NOT put secrets here.
[vars]
NEXT_PUBLIC_SITE_URL = "https://fairfix.pages.dev"
NEXT_PUBLIC_SITE_NAME = "FairFix.ie"
